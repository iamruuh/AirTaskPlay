<style>

.drow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15px}.drow:last-child{border-bottom:0}.drow>span:first-child{display:flex;flex-direction:column;min-width:0;word-break:break-word}

.sw i{position:absolute;inset:0;border-radius:99px;background:#2e352a;transition:.2s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}

</style></head><body><div id="shell">
